version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # prettier is the only dependency; bundle its non-breaking updates.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Other major bumps are deliberately left out of the groups, so
    # Dependabot opens a separate PR for each one for individual review.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Bundle all GitHub Actions version bumps into a single grouped PR.
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # As with npm, major action bumps get their own PRs for individual review.
