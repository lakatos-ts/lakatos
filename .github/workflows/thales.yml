name: thales

on:
  push:
    branches: [main, thales-rewrite]
    paths:
      - "thales/**"
      - "tarski/**"
      - "core/**"
      - "spec/**"
      - "tests/**"
      - "lemma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - ".github/workflows/thales.yml"
      # The setup action owns the Lake cache key; a change there must warm.
      - ".github/actions/thales-setup/**"
  # No path filter here: the gate job is a required check on main, and a
  # required check that never reports reads as pending forever. The
  # `changes` job below selects which Lean jobs the diff needs, and the
  # gate reports either way. The push trigger above stays filtered;
  # nothing gates on it.
  pull_request:
  # The merge queue builds each candidate on top of main and runs these
  # same jobs on it; the required checks report from this event too.
  merge_group:

# A superseded pull-request run is cancelled; a merge-queue run never is.
# Cancelling a queue run reports its required check as cancelled, which
# ejects the pull request from the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.x"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC

defaults:
  run:
    working-directory: thales

jobs:
  changes:
    # The diff of the event: a pull request's own commits, or a queue
    # candidate's own entry on top of what the queue already tested. A
    # rename counts as a deletion and an addition, so a Lean file moved
    # out of the tree still selects; the listing is NUL-separated so a
    # non-ASCII path arrives unquoted. When the diff cannot be computed,
    # every job runs.
    name: Changed paths
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lean: ${{ steps.scope.outputs.lean }}
      parity: ${{ steps.scope.outputs.parity }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select the jobs the diff needs
        id: scope
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if git diff -z --name-only --no-renames "$BASE...$HEAD" > changed.txt; then
            echo "changed paths:"
            tr '\0' '\n' < changed.txt
            node scripts/ci-scope.js select thales < changed.txt | tee -a "$GITHUB_OUTPUT"
          else
            echo "the diff from $BASE to $HEAD could not be computed; running everything"
            node scripts/ci-scope.js select thales --all | tee -a "$GITHUB_OUTPUT"
          fi

  lean-tests:
    name: Lean tests
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup

      - name: Format check
        run: npm run format:check
        working-directory: .

      - name: Lean tests
        run: lake build ThalesDslTest

  verdict-channel:
    name: Verdict channel ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every shard reports: one failing shard must not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup
        with:
          emit: "true"

      - name: Verdict channel
        run: npm run check:verdict-channel
        env:
          LAKATOS_VERDICT_SHARD: "${{ matrix.shard }}/3"

  envelopes:
    name: Envelope expectations ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports: one failing shard must not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup
        with:
          emit: "true"

      - name: Envelope expectations
        run: npm run check:envelopes
        env:
          LAKATOS_PROVE_E2E: "1"
          LAKATOS_ENVELOPE_SHARD: "${{ matrix.shard }}/3"

  prove-e2e:
    name: Prove end to end
    needs: changes
    # Also the parity suite's host, so a pabst change runs this job alone.
    if: needs.changes.outputs.lean == 'true' || needs.changes.outputs.parity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup
        with:
          emit: "true"

      - name: Prove end-to-end
        # vitest positionals are substring filters, so each names its whole
        # path; serialized because parallel forks would race lake builds in
        # the same checkout.
        run: npx vitest run --no-file-parallelism thales/tests/e2e.test.ts tests/prove-refute-parity.test.ts
        working-directory: .
        env:
          LAKATOS_PROVE_E2E: "1"

  verdict-corpus:
    name: Verdict corpus ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup
        with:
          emit: "true"

      # A shard is still one prove invocation, so it is still one Lean
      # build for everything it grades; the fixed cost of an invocation is
      # a second against a corpus whose marginal cost is minutes.
      - name: Verdict corpus
        run: npx vitest run --no-file-parallelism thales/tests/verdict-corpus.test.ts
        working-directory: .
        env:
          LAKATOS_PROVE_E2E: "1"
          LAKATOS_CORPUS_SHARD: "${{ matrix.shard }}/3"

  warm-cache:
    # A push to main gates nothing: every commit arrives through the merge
    # queue, which ran these checks on the same tree. But a run restores
    # caches only from its own ref or the default branch, and queue runs
    # live on throwaway gh-readonly-queue refs, so this is the only writer
    # of the refs/heads/main Lake cache that pull-request branches restore
    # from. It builds and saves; it runs nothing.
    name: Warm the Lake cache
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup
        id: setup
        with:
          emit: "true"

      - name: Save Lake build artifacts
        # A cache is immutable: when the exact key was restored, the build
        # it holds is this one, and saving again can only fail.
        if: steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            thales/.lake/build
            tarski/.lake/build
          key: ${{ steps.setup.outputs.cache-key }}

  thales:
    # The required-check context. Its name must stay exactly
    # "Build + verdict channel": the main ruleset names it, and a required
    # context that never reports blocks every pull request.
    name: Build + verdict channel
    if: always() && github.event_name != 'push'
    needs:
      [
        changes,
        lean-tests,
        verdict-channel,
        envelopes,
        prove-e2e,
        verdict-corpus,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `needs` alone does not fail this job when a dependency failed, was
      # cancelled, or was skipped. The script holds the selection table,
      # so it knows which skips were the plan and which were not.
      - name: Assert every selected job succeeded and no other ran
        working-directory: .
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | node scripts/ci-scope.js gate thales
