name: thales

on:
  push:
    branches: [main, thales-rewrite]
    paths:
      - "engines/thales/**"
      - "tarski/**"
      - "src/**"
      - "core/**"
      - "tests/**"
      - "lemma/**"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - ".github/workflows/thales.yml"
  # No path filter: this job is a required check on main, and a required
  # check that never reports reads as pending forever, not as skipped. The
  # push trigger above stays filtered — nothing gates on it.
  pull_request:
  # The merge queue builds each candidate on top of main and runs these
  # same jobs on it; the required checks report from this event too.
  merge_group:

# A superseded pull-request run is cancelled; a merge-queue run never is.
# Cancelling a queue run reports its required check as cancelled, which
# ejects the pull request from the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.x"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC

defaults:
  run:
    working-directory: engines/thales

jobs:
  lean-tests:
    name: Lean tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup

      - name: Format check
        run: npm run format:check
        working-directory: .

      - name: Lean tests
        run: lake build ThalesDslTest

  verdict-channel:
    name: Verdict channel
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup
        with:
          emit: "true"

      - name: Verdict channel
        run: npm run check:verdict-channel

  envelopes:
    name: Envelope expectations ${{ matrix.shard }}/3
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports: one failing shard must not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup
        with:
          emit: "true"

      - name: Envelope expectations
        run: npm run check:envelopes
        env:
          LAKATOS_PROVE_E2E: "1"
          LAKATOS_ENVELOPE_SHARD: "${{ matrix.shard }}/3"

  prove-e2e:
    name: Prove end to end
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup
        with:
          emit: "true"

      - name: Prove end-to-end
        # vitest positionals are substring filters (tests/e2e.test.ts also
        # matches engines/pabst/tests/e2e.test.ts); serialized because
        # parallel forks would race lake builds in the same checkout.
        run: npx vitest run --no-file-parallelism --exclude "engines/**" tests/e2e.test.ts
        working-directory: .
        env:
          LAKATOS_PROVE_E2E: "1"

  verdict-corpus:
    name: Verdict corpus ${{ matrix.shard }}/3
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup
        with:
          emit: "true"

      # A shard is still one prove invocation, so it is still one Lean
      # build for everything it grades; the fixed cost of an invocation is
      # a second against a corpus whose marginal cost is minutes.
      - name: Verdict corpus
        run: npx vitest run --no-file-parallelism --exclude "engines/**" tests/verdict-corpus.test.ts
        working-directory: .
        env:
          LAKATOS_PROVE_E2E: "1"
          LAKATOS_CORPUS_SHARD: "${{ matrix.shard }}/3"

  warm-cache:
    # A push to main gates nothing: every commit arrives through the merge
    # queue, which ran these checks on the same tree. But a run restores
    # caches only from its own ref or the default branch, and queue runs
    # live on throwaway gh-readonly-queue refs, so this is the only writer
    # of the refs/heads/main Lake cache that pull-request branches restore
    # from. It builds and saves; it runs nothing.
    name: Warm the Lake cache
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup
        with:
          emit: "true"

      - name: Save Lake build artifacts
        uses: actions/cache/save@v6
        with:
          path: |
            engines/thales/.lake/build
            tarski/.lake/build
          key: lake-v2-${{ runner.os }}-${{ hashFiles('tarski/lean-toolchain', 'tarski/lakefile.lean', 'engines/thales/lakefile.lean', 'engines/thales/lake-manifest.json') }}

  thales:
    # The required-check context. Its name must stay exactly
    # "Build + verdict channel": the main ruleset names it, and a required
    # context that never reports blocks every pull request.
    name: Build + verdict channel
    if: always() && github.event_name != 'push'
    needs: [lean-tests, verdict-channel, envelopes, prove-e2e, verdict-corpus]
    runs-on: ubuntu-latest
    steps:
      # `needs` alone does not fail a dependent job when a dependency is
      # cancelled or skipped, so a cancelled job would report this required
      # check green. Assert each result explicitly.
      - name: Assert every job succeeded
        working-directory: .
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "job results: $results"
          case "$results" in
            *failure* | *cancelled* | *skipped*)
              echo "at least one thales job did not succeed"
              exit 1
              ;;
          esac
          echo "all thales jobs succeeded"
