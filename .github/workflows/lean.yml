name: lean

on:
  push:
    branches: [main]
    paths:
      - "thales/**"
      - "spec/**"
      - "lemma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - ".github/workflows/lean.yml"
      # The setup action owns the Lake cache key; a change there must warm.
      - ".github/actions/lean-setup/**"
  # No path filter here: the gate job is a required check on main, and a
  # required check that never reports reads as pending forever. The
  # `changes` job below selects which Lean jobs the diff needs, and the
  # gate reports either way. The push trigger above stays filtered;
  # nothing gates on it.
  pull_request:
  # The merge queue builds each candidate on top of main and runs these
  # same jobs on it; the required checks report from this event too.
  merge_group:
  # The whole-suite run, weekly and on demand. Monday, three hours before
  # `lean-update`'s own cron, so the two never contend for a runner.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

# A superseded pull-request run is cancelled; a merge-queue run never is.
# Cancelling a queue run reports its required check as cancelled, which
# ejects the pull request from the queue.
concurrency:
  # The event is part of the key so the weekly whole-suite run and a
  # push to main, which share a ref, do not queue behind each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC

defaults:
  run:
    working-directory: thales

jobs:
  changes:
    # The diff of the event: a pull request's own commits, or a queue
    # candidate's own entry on top of what the queue already tested. A
    # rename counts as a deletion and an addition, so a Lean file moved
    # out of the tree still selects; the listing is NUL-separated so a
    # non-ASCII path arrives unquoted. When the diff cannot be computed,
    # every job runs.
    name: Changed paths
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prover: ${{ steps.scope.outputs.prover }}
      semantics: ${{ steps.scope.outputs.semantics }}
      exe: ${{ steps.scope.outputs.exe }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select the jobs the diff needs
        id: scope
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if git diff -z --name-only --no-renames "$BASE...$HEAD" > changed.txt; then
            echo "changed paths:"
            tr '\0' '\n' < changed.txt
            node scripts/ci-scope.js select lean < changed.txt | tee -a "$GITHUB_OUTPUT"
          else
            echo "the diff from $BASE to $HEAD could not be computed; running everything"
            node scripts/ci-scope.js select lean --all | tee -a "$GITHUB_OUTPUT"
          fi

  lean-tests:
    name: Lean tests and fixture scripts
    needs: changes
    if: needs.changes.outputs.prover == 'true' || needs.changes.outputs.semantics == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/lean-setup

      - name: Format check
        run: npm run format:check
        working-directory: .

      # The runner's tests parse with this checkout's lemma, built by the setup.
      - name: Lean tests
        run: lake build Test

      # Every arithmetic and comparison under `Tarski/` must be one the
      # `Js` library models, and a check that has never refused anything
      # is not evidence — so the planted violation is run too.
      - name: Boundary check
        run: sh scripts/check-boundary.sh

      - name: Boundary check bites
        run: |
          if sh scripts/check-boundary.sh scripts/boundary-fixture; then
            echo "the check accepted a planted Float.sqrt"
            exit 1
          fi

      # Nothing under `Js/` or `Tarski/` imports the prover, and the
      # planted import shows the check still refuses one.
      - name: Import boundary check
        run: sh scripts/check-imports.sh

      - name: Import boundary check bites
        run: |
          if sh scripts/check-imports.sh scripts/import-fixture; then
            echo "the check accepted a planted import of ThalesDsl"
            exit 1
          fi

      # The seam end to end: these documents are the parser bridge's
      # output, byte for byte (thales/tests/tarski/lean-fixtures.test.ts
      # holds the two copies together), and the binary is what reads them.
      - name: Run a script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/numeric-loop.json)
          test "$out" = "8" || { echo "expected 8, got $out"; exit 1; }

      # The issue's own example: closures over one cell, a prototype
      # chain, `typeof`, and a `return` caught with the heap intact.
      - name: Run the counter script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/counter.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # #379's example: a thrown RangeError caught by `instanceof`, its
      # message concatenated in a `finally`.
      - name: Run the errors script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/errors.json)
          test "$out" = "zero!" || { echo "expected zero!, got $out"; exit 1; }

      # #380's example: string concatenation and comparison, an array's
      # live `length`, `push`, `join`, `Array.isArray`, and `Object.is`
      # through the library's `sameValue`.
      - name: Run the harness-floor script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/harness-floor.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # The test262 harness's own `compareArray`, transcribed with `let`
      # and `while`: array `length`, index reads, and the two values
      # `===` gets wrong.
      - name: Run the compareArray script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/compare-array.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # #383's example: a `let` head copied per iteration, so the closures
      # the body made read 0 and 2; a `switch` with a `default`; `+=`,
      # `-=`, `i++`, `void`; and a `var` hoisted past its own declaration.
      - name: Run the for-switch-var script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/for-switch-var.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # #384's example: a private field, a constructor that throws a
      # `RangeError`, a getter, a method that constructs another instance,
      # and `instanceof`.
      - name: Run the class-box script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/class-box.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # Private methods, accessors, a static block, and super member writes:
      # a private method bumping a private field, a private getter and
      # setter pair, a static private method, one function object shared
      # across instances, nothing visible to `Object.keys` or `in`, the
      # brand check on a foreign object, a static block reading a static
      # field before it, and `super.x = v` landing on the receiver.
      - name: Run the class-elements script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/class-elements.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # The four class fixtures `thales` proves `Theorem`s over,
      # stripped of their types, with each `@ensures` instantiated at one
      # witness. This is the fragment the prover's own tests assume the
      # evaluator agrees with.
      - name: Run the emitter fixtures
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/emitter-classes.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # #393's example: a hoisted function read by `typeof` ahead of its
      # own text, `arguments.length`, a labelled `continue` through a
      # `switch`, and the dead zone at script level caught as a
      # `ReferenceError`.
      - name: Run the hoisting-arguments script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/hoisting-arguments.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # #395's example: a shorthand, a computed key, a method reading
      # `this`, a getter, a cooked template with two substitutions, and a
      # tagged template whose tag reads `raw` and counts its arguments.
      - name: Run the template-object script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/template-object.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # And what an uncaught throw looks like from outside: the report on
      # stderr, nothing on stdout, exit 1.
      - name: Report an uncaught throw
        run: |
          set +e
          err=$(.lake/build/bin/tarski run Test/Tarski/fixtures/uncaught.json 2>&1 >/dev/null)
          status=$?
          set -e
          test "$status" = "1" || { echo "expected exit 1, got $status"; exit 1; }
          test "$err" = "Uncaught TypeError: not a function" || {
            echo "expected the TypeError report, got: $err"; exit 1; }

      # `print` is the host binding test262 requires, and what it wrote
      # comes out ahead of the completion value.
      - name: Run the print script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/print.json)
          expected=$(printf 'a\n2\nt\nundefined')
          test "$out" = "$expected" || { echo "expected a/2/t/undefined, got $out"; exit 1; }

      # #382's example: `Math.fround`, `Number.isSafeInteger`,
      # `Math.round` of `-0.4` read through `Object.is`, `Math.max`
      # propagating a NaN, and `Number.EPSILON` against `2 ** -52` — every
      # one of them the library's own definition.
      - name: Run the number-math script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/number-math.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # #388's example: the shortest round-tripping digits of `0.1 + 0.2`,
      # the `1e21` threshold, a twenty-one-digit integer, radix 16, and
      # StringToNumber's hex, white-space, separator, and empty-string
      # cases — every one of them the library's own definition over
      # `Float.Model`.
      - name: Run the number-conversions script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/number-conversions.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # #386's example, and what `exec` does differently from `run`: the
      # program's `console.log` reaches stdout, the uncaught throw is
      # reported on stderr with exit 1, and there is no completion-value
      # line after either.
      - name: Run the exe example
        run: |
          set +e
          out=$(.lake/build/bin/tarski exec Test/Tarski/fixtures/exe-example.json 2>/tmp/exe-err)
          status=$?
          set -e
          test "$status" = "1" || { echo "expected exit 1, got $status"; exit 1; }
          test "$out" = "0.25" || { echo "expected 0.25, got $out"; exit 1; }
          err=$(cat /tmp/exe-err)
          test "$err" = "Uncaught RangeError: zero" || {
            echo "expected the RangeError report, got: $err"; exit 1; }

      # #389's example: a non-writable, non-enumerable own property
      # refusing a strict-mode write, its descriptor read back,
      # `Object.keys` hiding it, `call` and `bind` giving a function its
      # `this`, `for`-`in` in own-key order, and `delete`.
      - name: Run the object-function script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/object-function.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # #392's example: a computed symbol key that `JSON.stringify` passes
      # over, a round trip through `JSON.parse`, `typeof`, `description`,
      # the registry, and an `Error` `cause`.
      - name: Run the symbol-json-error script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/symbol-json-error.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # #391's example: the `String` surface, UTF-16 code units — a
      # surrogate pair coming apart and joining back, and the code-unit
      # order — and the String wrapper object's own keys.
      - name: Run the string-builtins script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/string-builtins.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # #394's example: a user iterator under `for`-`of`, a spread into
      # `Math.max`, an array pattern with a hole and a rest, and an object
      # pattern with a nested default and a rest.
      - name: Run the iterators script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/iterators.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

      # #390's example: a comparator sort, `map` and `filter` through
      # ArraySpeciesCreate, `indexOf`, an unbounded `flat`, and
      # `Array.from` over an array-like with a mapper.
      - name: Run the array-builtins script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/array-builtins.json)
          test "$out" = "true" || { echo "expected true, got $out"; exit 1; }

  test262-slice:
    name: test262 slice ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.semantics == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Every shard reports: one failing shard must not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/lean-setup

      # The suite itself, at the commit in thales/test262/pin.json. The
      # clone is a build artifact: cached by the pin's hash, fetched at
      # depth 1 by SHA, never a submodule.
      - name: Cache test262
        uses: actions/cache@v6
        with:
          path: thales/.test262
          key: test262-${{ hashFiles('thales/test262/pin.json') }}

      - name: Set up test262
        timeout-minutes: 5
        run: .lake/build/bin/tarski-test262 setup

      # The PR-gated slice. `thales/test262/slice.txt` is the list, so
      # growing it is a line in that file rather than an edit here; the
      # committed table is the ratchet, and a count that moved in either
      # direction fails until it is written down.
      - name: test262 PR-gated slice
        # The two class directories #384 joined are about five thousand
        # tests on their own, which roughly doubled the step's wall clock,
        # #393's fifteen add about 2,600 more, #391's
        # `test/built-ins/String` adds 1,223, #394's ten add about 1,500
        # with every other directory's `dstr` subtree behind them, and
        # #390's `Array` adds 2,958 whose callbacks are evaluator calls
        # of their own. Eight minutes locally, against three before #390.
        # A shard cannot be checked against the committed table on its
        # own: the expectations are per directory and compared in both
        # directions, so every directory this shard was not given reads as
        # "expected but not run". Each shard writes its counts and the
        # aggregator checks their union.
        timeout-minutes: 20
        env:
          LAKATOS_LEMMA: ${{ github.workspace }}/lemma
        run: |
          .lake/build/bin/tarski-test262 \
            --slice-file test262/slice.txt \
            --shard ${{ matrix.shard }}/3 \
            --write "shard-${{ matrix.shard }}.json"

      - name: Upload this shard's counts
        uses: actions/upload-artifact@v7
        with:
          name: test262-shard-${{ matrix.shard }}
          path: thales/shard-${{ matrix.shard }}.json
          if-no-files-found: error

      # The required job below merges the shards with this same binary
      # rather than building Lean again.
      - name: Upload the runner
        if: matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: tarski-test262-bin
          path: thales/.lake/build/bin/tarski-test262
          if-no-files-found: error

  runner-e2e:
    name: Runner and exe end to end
    needs: changes
    # Also `tarski <file.ts>`'s host, so a lemma or fixture change runs this
    # job alone.
    if: needs.changes.outputs.semantics == 'true' || needs.changes.outputs.exe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/lean-setup

      # The suites that need the real binary: what ties the fake binary the
      # unit tests run to the real one, `tarski <file.ts>` through lemma's
      # gate, and the comparison of every `@ensures` fixture in the repo
      # against Node. Serialized, because two forks would race `lake build`.
      - name: Runner and exe end to end
        timeout-minutes: 10
        working-directory: .
        env:
          LAKATOS_TARSKI_E2E: "1"
        run: |
          npx vitest run --no-file-parallelism \
            thales/tests/tarski/test262-e2e.test.ts \
            thales/tests/tarski/test262-cli.test.ts \
            thales/tests/tarski/exe-e2e.test.ts \
            thales/tests/tarski/exe-fixtures.test.ts

  verdict-channel:
    name: Verdict channel ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.prover == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LAKATOS_LEMMA: ${{ github.workspace }}/lemma
    strategy:
      # Every shard reports: one failing shard must not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/lean-setup

      - name: Verdict channel
        run: npm run check:verdict-channel
        working-directory: .
        env:
          LAKATOS_VERDICT_SHARD: "${{ matrix.shard }}/3"

  envelopes:
    name: Envelope expectations ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.prover == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LAKATOS_LEMMA: ${{ github.workspace }}/lemma
    strategy:
      # Every shard reports: one failing shard must not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/lean-setup

      - name: Envelope expectations
        run: npm run check:envelopes
        working-directory: .
        env:
          LAKATOS_PROVE_E2E: "1"
          LAKATOS_ENVELOPE_SHARD: "${{ matrix.shard }}/3"

  prove-e2e:
    name: Prove end to end
    needs: changes
    if: needs.changes.outputs.prover == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LAKATOS_LEMMA: ${{ github.workspace }}/lemma
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/lean-setup

      - name: Prove end-to-end
        # vitest positionals are substring filters, so each names its whole
        # path, and thales/tests/cli- every bin suite; serialized because
        # parallel forks would race lake builds in the same checkout.
        run: npx vitest run --no-file-parallelism thales/tests/e2e.test.ts thales/tests/cli-
        working-directory: .
        env:
          LAKATOS_PROVE_E2E: "1"

  verdict-corpus:
    name: Verdict corpus ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.prover == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LAKATOS_LEMMA: ${{ github.workspace }}/lemma
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/lean-setup

      # A shard is still one prove invocation, so it is still one Lean
      # build for everything it grades; the fixed cost of an invocation is
      # a second against a corpus whose marginal cost is minutes.
      - name: Verdict corpus
        run: npx vitest run --no-file-parallelism thales/tests/verdict-corpus.test.ts
        working-directory: .
        env:
          LAKATOS_PROVE_E2E: "1"
          LAKATOS_CORPUS_SHARD: "${{ matrix.shard }}/3"

  warm-cache:
    # A push to main gates nothing: every commit arrives through the merge
    # queue, which ran these checks on the same tree. But a run restores
    # caches only from its own ref or the default branch, and queue runs
    # live on throwaway gh-readonly-queue refs, so this is the only writer
    # of the refs/heads/main Lake cache that pull-request branches restore
    # from. It builds and saves; it runs nothing.
    name: Warm the Lake cache
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/lean-setup
        id: setup

      - name: Save Lake build artifacts
        # A cache is immutable: when the exact key was restored, the build
        # it holds is this one, and saving again can only fail.
        if: steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: thales/.lake/build
          key: ${{ steps.setup.outputs.cache-key }}

      # The test262 clone is warmed here too, keyed by the pin rather than
      # by the tree, so a slice job restores it instead of cloning.
      - name: Cache test262
        uses: actions/cache@v6
        with:
          path: thales/.test262
          key: test262-${{ hashFiles('thales/test262/pin.json') }}

      - name: Set up test262
        timeout-minutes: 5
        run: .lake/build/bin/tarski-test262 setup

  lean:
    # The required-check context. Its name must stay exactly "Lean": the
    # main ruleset names it, and a required context that never reports
    # blocks every pull request.
    name: Lean
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs:
      [
        changes,
        lean-tests,
        test262-slice,
        runner-e2e,
        verdict-channel,
        envelopes,
        prove-e2e,
        verdict-corpus,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The ratchet is compared once, over the union of the shards: the
      # committed table is per directory, and the slice file names disjoint
      # subtrees, so every directory belongs to exactly one shard and the
      # union is the whole table. A directory counted twice is refused.
      - name: Download every shard's counts
        if: needs.test262-slice.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: test262-shard-*
          path: thales/shards
          merge-multiple: true

      - name: Download the runner
        if: needs.test262-slice.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: tarski-test262-bin
          path: thales/.lake/build/bin

      - name: Check the union against the expectations
        if: needs.test262-slice.result == 'success'
        run: |
          chmod +x .lake/build/bin/tarski-test262
          .lake/build/bin/tarski-test262 \
            --merge shards/shard-1.json \
            --merge shards/shard-2.json \
            --merge shards/shard-3.json \
            --check test262/expected.json

      # `needs` alone does not fail this job when a dependency failed, was
      # cancelled, or was skipped. The script holds the selection table,
      # so it knows which skips were the plan and which were not.
      - name: Assert every selected job succeeded and no other ran
        working-directory: .
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | node scripts/ci-scope.js gate lean

  # The second tier: the whole of `language`, `built-ins`, and `intl402`,
  # weekly and on demand, writing `thales/test262/results.{md,json}`. A
  # regression shows as a diff in those files on the next run rather than
  # as a red pull request. The slices, the per-test timeout, and the
  # budget all live in `scripts/test262-full.sh`, which is also what a
  # person runs locally to reproduce the table.
  full-run:
    name: Full test262 run
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The run's own budget is 240 minutes inside a 300-minute step inside
    # this job, so exhausting the budget writes a table saying so rather
    # than losing the run to a cancelled job.
    timeout-minutes: 330
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/lean-setup

      - name: Cache test262
        uses: actions/cache@v6
        with:
          path: thales/.test262
          key: test262-${{ hashFiles('thales/test262/pin.json') }}

      - name: Set up test262
        timeout-minutes: 5
        run: .lake/build/bin/tarski-test262 setup

      - name: Full run
        timeout-minutes: 300
        env:
          LAKATOS_LEMMA: ${{ github.workspace }}/lemma
        run: sh scripts/test262-full.sh

      # The table is committed only when it changed, so an unchanged week
      # leaves no commit behind. The push to `main` is tried first and
      # falls back to a pull request: the `main` ruleset (read 2026-09-14)
      # requires four status checks with no bypass actor, and a commit the
      # job has just made has no check runs, so no token can land it. If a
      # maintainer ever adds a bypass actor for the Actions app the push
      # simply starts working; until then the table arrives as a pull
      # request which, like `lean-update`'s, needs a close-and-reopen
      # before its checks will run. Opening that pull request needs the
      # repository setting "Allow GitHub Actions to create and approve
      # pull requests" (Settings > Actions > General), which was off on
      # 2026-09-14: until it is on, the branch `test262-results` still
      # carries the table, the step fails naming the setting, and the
      # pull request is opened by hand from that branch.
      - name: Commit the table
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thales/test262/results.md thales/test262/results.json
          if git diff --cached --quiet; then
            echo "results unchanged"
            exit 0
          fi
          pin=$(jq -r .commit thales/test262/pin.json)
          git commit -m "test262 results at $pin from ${{ github.sha }}"
          if git push origin HEAD:main; then
            echo "pushed to main"
            exit 0
          fi
          echo "the main ruleset refused the push; opening a pull request"
          git push --force origin HEAD:refs/heads/test262-results
          totals=$(jq -r '.totals | "\(.pass) pass, \(.fail) fail, \(.unsupported) unsupported, \(.timeout) timeout, \(.harnessError) harness-error, \(.notRun | add) not-run"' thales/test262/results.json)
          cat > /tmp/test262-results-body.md <<BODY
          The scheduled whole-suite run over \`test/language\`, \`test/built-ins\`, and \`test/intl402\`, at test262 \`$pin\`, from ${{ github.sha }}.

          Totals: $totals.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This arrives as a pull request because the \`main\` ruleset requires status checks with no bypass actor, so the job's own commit cannot be pushed to \`main\`. A pull request opened by \`GITHUB_TOKEN\` gets no CI run until it is closed and reopened, or pushed to.
          BODY
          number=$(gh pr list --head test262-results --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --base main --head test262-results \
              --title "test262 results at $pin" \
              --body-file /tmp/test262-results-body.md || {
              echo "the table is on branch test262-results but no pull request could be opened:"
              echo "enable 'Allow GitHub Actions to create and approve pull requests' under Settings > Actions > General, or open it by hand"
              exit 1
            }
          else
            gh pr edit "$number" --body-file /tmp/test262-results-body.md
          fi
