name: parity

# Prove and refute over the same files. Scheduled and on demand only, never
# a required check, so no engine's merge waits on the other's. Both engines
# are built from this checkout until each ships a release to run instead
# (`LAKATOS_THALES`, `LAKATOS_PABST`).
on:
  # Wednesday, clear of `lean`'s and `lean-update`'s Monday runs.
  schedule:
    - cron: "0 5 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC

jobs:
  parity:
    name: Prove and refute agree
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node, the built TypeScript (pabst among it), and the Lean thales.
      - uses: ./.github/actions/lean-setup

      - name: Parity
        run: npx vitest run --config parity/vitest.config.ts
