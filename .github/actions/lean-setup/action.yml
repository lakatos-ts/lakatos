name: lean setup
description: The Lean toolchain, Node, the built TypeScript, and a restored Lake build of the thales package, brought up to date.

outputs:
  cache-key:
    description: The exact Lake cache key for this tree; the push-to-main warmer saves under it.
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-hit:
    description: "'true' when that exact key was restored, so there is nothing new to save."
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install Lean toolchain
      uses: leanprover/lean-action@v1
      with:
        lake-package-directory: thales
        # We run our own lake commands below; tell the action not to build/test/lint.
        auto-config: false
        build: false
        test: false
        lint: false
        # The Lake build is cached by hand below.
        use-github-cache: false

    # lemma, which every executable reaches as a subprocess, is TypeScript.
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: "24.x"
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install npm dependencies
      run: npm ci
      shell: bash

    - name: Build the TypeScript
      run: npm run build
      shell: bash

    # Restore only; the push-to-main warmer is the single writer. Caches are
    # immutable, so the key digests the Lean sources; the prefix (toolchain,
    # lakefile, manifest) is the compatibility fallback.
    - name: Restore Lake build artifacts
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: thales/.lake/build
        key: lean-v1-${{ runner.os }}-${{ hashFiles('thales/lean-toolchain', 'thales/lakefile.lean', 'thales/lake-manifest.json') }}-${{ hashFiles('thales/*.lean', 'thales/Js/**/*.lean', 'thales/Tarski/**/*.lean', 'thales/Thales/**/*.lean', 'thales/ThalesDsl/**/*.lean', 'thales/ThalesEmit/**/*.lean', 'thales/Test/**/*.lean') }}
        restore-keys: |
          lean-v1-${{ runner.os }}-${{ hashFiles('thales/lean-toolchain', 'thales/lakefile.lean', 'thales/lake-manifest.json') }}-

    # Every library and all three executables are default targets.
    - name: Build
      run: lake build
      shell: bash
      working-directory: thales
