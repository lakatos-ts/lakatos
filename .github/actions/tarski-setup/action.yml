name: tarski setup
description: Node, Lean toolchain, a restored Lake build, and the built TypeScript for the tarski package.

outputs:
  cache-key:
    description: The exact Lake cache key for this tree; the push-to-main warmer saves under it.
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-hit:
    description: "'true' when that exact key was restored, so there is nothing new to save."
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # The runner is TypeScript and the binary is Lean, and the checks these
    # jobs run need both. The bridge's own vitest suites still run in
    # `lakatos.yml`.
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install Lean toolchain
      uses: leanprover/lean-action@v1
      with:
        lake-package-directory: tarski
        auto-config: false
        build: false
        test: false
        lint: false
        use-github-cache: false

    # Restore only; the push-to-main warmer is the single writer. The key is
    # a compatibility prefix (toolchain, lakefile, manifest) and a digest of
    # every Lean source lake reads: a cache is immutable, so each main build
    # needs a key of its own, and the prefix lets a miss restore the newest
    # compatible build for lake to bring up to date.
    - name: Restore Lake build artifacts
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: tarski/.lake/build
        key: tarski-v2-${{ runner.os }}-${{ hashFiles('tarski/lean-toolchain', 'tarski/lakefile.lean', 'tarski/lake-manifest.json') }}-${{ hashFiles('tarski/*.lean', 'tarski/Js/**/*.lean', 'tarski/Tarski/**/*.lean', 'tarski/Test/**/*.lean') }}
        restore-keys: |
          tarski-v2-${{ runner.os }}-${{ hashFiles('tarski/lean-toolchain', 'tarski/lakefile.lean', 'tarski/lake-manifest.json') }}-

    - name: Install npm dependencies
      run: npm ci
      shell: bash

    - name: Build the TypeScript
      run: npm run build
      shell: bash

    - name: Build
      run: lake build
      shell: bash
      working-directory: tarski
