name: thales setup
description: Lean toolchain, Node, npm, and a restored Lake build for the thales package.

inputs:
  emit:
    description: Also build the thales-emit binary.
    default: "false"

outputs:
  cache-key:
    description: The exact Lake cache key for this tree; the push-to-main warmer saves under it.
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-hit:
    description: "'true' when that exact key was restored, so there is nothing new to save."
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install Lean toolchain
      uses: leanprover/lean-action@v1
      with:
        lake-package-directory: thales
        # We run our own lake commands below; tell the action not to build/test/lint.
        auto-config: false
        build: false
        test: false
        lint: false
        # We manage .lake/build + .lake/packages caching manually below.
        use-github-cache: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24.x"
        cache: npm
        cache-dependency-path: package-lock.json

    - name: npm install
      run: npm ci
      shell: bash

    - name: Build the front end
      # The root script, not a bare tsc: core is a referenced project and
      # must be emitted before the front end resolves it.
      run: npm run build
      shell: bash

    # Restore only; the push-to-main warmer is the single writer. Caches are
    # immutable, so the key digests the Lean sources; the prefix (toolchain,
    # lakefiles, manifests) is the compatibility fallback.
    - name: Restore Lake build artifacts
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: |
          thales/.lake/build
          tarski/.lake/build
        key: lake-v4-${{ runner.os }}-${{ hashFiles('tarski/lean-toolchain', 'tarski/lakefile.lean', 'tarski/lake-manifest.json', 'thales/lakefile.lean', 'thales/lake-manifest.json') }}-${{ hashFiles('tarski/*.lean', 'tarski/Js/**/*.lean', 'tarski/Tarski/**/*.lean', 'tarski/Test/**/*.lean', 'thales/*.lean', 'thales/ThalesDsl/**/*.lean', 'thales/ThalesEmit/**/*.lean', 'thales/Test/**/*.lean') }}
        restore-keys: |
          lake-v4-${{ runner.os }}-${{ hashFiles('tarski/lean-toolchain', 'tarski/lakefile.lean', 'tarski/lake-manifest.json', 'thales/lakefile.lean', 'thales/lake-manifest.json') }}-

    - name: Build
      run: lake build
      shell: bash
      working-directory: thales

    - name: Build thales-emit
      # A lean_exe is not a default target; the checks that run it ask for it.
      if: inputs.emit == 'true'
      run: lake build thales-emit
      shell: bash
      working-directory: thales
